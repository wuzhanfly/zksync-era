# 高 TPS 优化配置
# 基于 general.yaml，针对性能优化

state_keeper:
  # 🔥 关键优化：减少区块提交延迟
  block_commit_deadline_ms: 500          # 从 3000ms 降到 500ms - 更快封装区块
  miniblock_commit_deadline_ms: 200      # 从 1000ms 降到 200ms - 更快封装 miniblock
  
  # 🔥 增加交易处理能力
  transaction_slots: 20000               # 从 10000 增加到 20000
  max_single_tx_gas: 15000000           # 保持不变
  max_gas_per_batch: 500000000          # 从 200000000 增加到 500000000
  
  # 🔥 提高区块容量
  miniblock_max_payload_size: 5000000   # 从 1000000 增加到 5000000
  miniblock_seal_queue_capacity: 50     # 从 10 增加到 50
  
  # 其他参数保持
  batch_overhead_l1_gas: 800000
  close_block_at_eth_params_percentage: 0.95
  close_block_at_gas_percentage: 0.95
  close_block_at_geometry_percentage: 0.95
  compute_overhead_part: 0
  fee_model_version: V2
  max_allowed_l2_tx_gas_limit: 15000000000
  max_circuits_per_batch: 27000
  max_pubdata_per_batch: 500000
  minimal_l2_gas_price: 100000000
  protective_reads_persistence_enabled: false
  pubdata_overhead_part: 1
  reject_tx_at_eth_params_percentage: 0.95
  reject_tx_at_gas_percentage: 0.95
  reject_tx_at_geometry_percentage: 0.95
  save_call_traces: true
  validation_computational_gas_limit: 300000

mempool:
  # 🔥 优化内存池
  sync_interval_ms: 5                    # 从 10ms 降到 5ms - 更快同步
  delay_interval: 50                     # 从 100ms 降到 50ms
  capacity: 20000000                     # 从 10000000 增加到 20000000
  sync_batch_size: 2000                  # 从 1000 增加到 2000
  remove_stuck_txs: true
  stuck_tx_timeout: 172800

api:
  web3_json_rpc:
    # 🔥 API 优化
    pubsub_polling_interval: 100         # 从 200ms 降到 100ms
    max_nonce_ahead: 500                 # 从 200 增加到 500
    max_tx_size: 2000000                 # 从 1000000 增加到 2000000
    
    # 保持其他参数
    api_namespaces:
    - en
    - eth
    - net
    - web3
    - zks
    - pubsub
    - debug
    - unstable
    estimate_gas_acceptable_overestimation: 5000
    estimate_gas_scale_factor: 1.3
    filters_disabled: false
    filters_limit: 10000
    gas_price_scale_factor: 1.5
    http_port: 3050
    http_url: http://127.0.0.1:3050/
    req_entities_limit: 10000
    subscriptions_limit: 10000
    ws_port: 3051
    ws_url: ws://127.0.0.1:3051/

postgres:
  # 🔥 数据库优化
  max_connections: 500                   # 从 200 增加到 500
  statement_timeout_sec: 300

db:
  experimental:
    state_keeper_db_block_cache_capacity_mb: 512  # 从 128 增加到 512
  merkle_tree:
    block_cache_size_mb: 512             # 从 128 增加到 512
    memtable_capacity_mb: 512            # 从 256 增加到 512
    max_l1_batches_per_iter: 50          # 从 20 增加到 50
    mode: FULL
    multi_get_chunk_size: 1000           # 从 500 增加到 1000
    stalled_writes_timeout_sec: 60

eth:
  sender:
    # 🔥 L1 交易发送优化
    tx_poll_period: 100 ms               # 从 300ms 降到 100ms
    aggregate_tx_poll_period: 100 ms     # 从 300ms 降到 100ms
    max_txs_in_flight: 100               # 从 50 增加到 100
    max_aggregated_tx_gas: 30000000      # 从 15000000 增加
    
    # 保持其他参数
    aggregated_block_commit_deadline: 3
    aggregated_block_execute_deadline: 5
    aggregated_block_prove_deadline: 5
    fusaka_upgrade_block: 0
    fusaka_upgrade_safety_margin: 0
    gas_limit_mode: CALCULATED
    is_verifier_pre_fflonk: true
    max_acceptable_base_fee_in_wei: 100000000000
    max_acceptable_priority_fee_in_gwei: 5000000000
    max_aggregated_blocks_to_commit: 1
    max_aggregated_blocks_to_execute: 10
    proof_sending_mode: SKIP_EVERY_PROOF
    pubdata_sending_mode: CALLDATA
    timestamp_criteria_max_allowed_lag: 30
    use_fusaka_blob_format: true

operations_manager:
  delay_interval: 50                     # 从 100ms 降到 50ms

prometheus:
  listener_port: 3314
  push_interval_ms: 100
  pushgateway_url: http://127.0.0.1:9091
