user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    # 超时配置
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # 缓冲配置
    proxy_buffering off;
    proxy_request_buffering off;

    # BSC Testnet RPC 上游服务器组
    upstream bsc_testnet_rpc {
        # 本地节点（主节点）
        server 13.212.114.138:10575 max_fails=3 fail_timeout=30s weight=10;
        
        # 官方节点（备用）
        server bsc-testnet-dataseed.bnbchain.org:443 max_fails=3 fail_timeout=30s backup;
        
        # 其他官方节点（备用）
        server bsc-prebsc-dataseed.bnbchain.org:443 max_fails=3 fail_timeout=30s backup;
        
        # 保持连接
        keepalive 32;
        keepalive_timeout 60s;
    }

    server {
        listen 8545;
        server_name localhost;

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # RPC 代理
        location / {
            # 代理到上游服务器组
            proxy_pass http://bsc_testnet_rpc;
            
            # 保持原始请求头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # HTTP 版本
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # 错误处理：自动切换到下一个上游服务器
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            
            # 限制请求大小
            client_max_body_size 10M;
        }
    }

    # HTTPS 支持（如果需要）
    server {
        listen 8546 ssl;
        server_name localhost;

        # SSL 证书（需要自行配置）
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        location / {
            proxy_pass http://bsc_testnet_rpc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
