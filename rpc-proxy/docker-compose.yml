version: '3.8'

services:
  rpc-proxy:
    image: nginx:alpine
    container_name: bsc-rpc-proxy
    restart: unless-stopped
    ports:
      - "8545:8545"      # HTTP RPC 端口
      # - "8546:8546"    # HTTPS RPC 端口（可选）
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    networks:
      - tmai-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8545/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tmai-network:
    external: true
